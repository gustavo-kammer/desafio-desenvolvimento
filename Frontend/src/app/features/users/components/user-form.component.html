<form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error(); as message) {
    <app-alert>{{ message }}</app-alert>
  }

  <div>
    <label for="uf-name" class="field-label">Nome</label>
    <input id="uf-name" class="field-input" formControlName="name" maxlength="120" />
    @if (isInvalid(form.controls.name)) {
      <p class="field-error">Informe o nome.</p>
    }
  </div>

  <div>
    <label for="uf-email" class="field-label">E-mail</label>
    <input
      id="uf-email"
      type="email"
      class="field-input"
      formControlName="email"
      maxlength="160"
      autocomplete="off"
    />
    @if (isInvalid(form.controls.email)) {
      <p class="field-error">Informe um e-mail válido.</p>
    }
  </div>

  <div>
    <label for="uf-role" class="field-label">Perfil</label>
    <select id="uf-role" class="field-input" formControlName="role">
      @for (option of roleOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  @if (!isEditing()) {
    <div>
      <label for="uf-password" class="field-label">Senha inicial</label>
      <input
        id="uf-password"
        type="password"
        class="field-input"
        formControlName="password"
        maxlength="72"
        autocomplete="new-password"
      />
      @if (isInvalid(form.controls.password)) {
        <p class="field-error">A senha deve ter de 8 a 72 caracteres.</p>
      }
    </div>
  }

  <app-form-actions
    [submitLabel]="isEditing() ? 'Salvar alterações' : 'Criar usuário'"
    [saving]="saving()"
    (cancelled)="cancelled.emit()"
  />
</form>
