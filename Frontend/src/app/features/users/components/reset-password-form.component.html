<form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error(); as message) {
    <div
      role="alert"
      class="rounded-md border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
    >
      {{ message }}
    </div>
  }

  <p class="text-sm text-slate-600">
    Defina uma nova senha para <strong>{{ user().name }}</strong> ({{ user().email }}).
  </p>

  <div>
    <label for="rp-password" class="field-label">Nova senha</label>
    <input
      id="rp-password"
      type="password"
      class="field-input"
      formControlName="newPassword"
      maxlength="72"
      autocomplete="new-password"
    />
    @if (form.controls.newPassword.touched && form.controls.newPassword.invalid) {
      <p class="field-error">A senha deve ter de 8 a 72 caracteres.</p>
    }
  </div>

  <div class="flex justify-end gap-2 pt-2">
    <button appButton type="button" variant="secondary" (click)="cancelled.emit()">Cancelar</button>
    <button appButton type="submit" [loading]="saving()">Redefinir senha</button>
  </div>
</form>
