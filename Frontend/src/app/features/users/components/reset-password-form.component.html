<form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error(); as message) {
    <app-alert>{{ message }}</app-alert>
  }

  <p class="text-sm text-text-muted">
    Defina uma nova senha para <strong>{{ user().name }}</strong> ({{ user().email }}).
  </p>

  <div>
    <label for="rp-password" class="field-label">Nova senha</label>
    <input
      id="rp-password"
      type="password"
      class="field-input"
      formControlName="newPassword"
      maxlength="72"
      autocomplete="new-password"
    />
    @if (isInvalid(form.controls.newPassword)) {
      <p class="field-error">A senha deve ter de 8 a 72 caracteres.</p>
    }
  </div>

  <app-form-actions
    submitLabel="Redefinir senha"
    [saving]="saving()"
    (cancelled)="cancelled.emit()"
  />
</form>
