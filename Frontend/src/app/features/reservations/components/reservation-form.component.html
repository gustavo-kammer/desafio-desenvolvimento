<form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4" novalidate>
  @if (error(); as message) {
    <app-alert>{{ message }}</app-alert>
  }

  <div>
    <label for="productId" class="field-label">Produto</label>
    <select id="productId" formControlName="productId" class="field-input">
      <option [ngValue]="0" disabled>Selecione um produto</option>
      @for (product of products(); track product.id) {
        <option [ngValue]="product.id">
          {{ product.code }} · {{ product.name }} (disp.:
          {{ product.stock.availableQuantity | quantity: product.unit }})
        </option>
      }
    </select>
    @if (isInvalid(form.controls.productId)) {
      <p class="field-error">Selecione um produto.</p>
    }
  </div>

  <div>
    <label for="quantity" class="field-label">Quantidade</label>
    <input
      id="quantity"
      type="number"
      [attr.step]="quantityStep()"
      formControlName="quantity"
      class="field-input"
    />
    @if (isInvalid(form.controls.quantity)) {
      <p class="field-error">Informe uma quantidade maior que zero.</p>
    }
  </div>

  <app-form-actions
    submitLabel="Reservar"
    [saving]="saving()"
    cancelLabel="Fechar"
    (cancelled)="cancel()"
  />
</form>
