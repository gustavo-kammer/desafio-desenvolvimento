<app-page-header
  heading="Movimentações"
  subtitle="Consulte o histórico completo de entradas, saídas, reservas e ajustes."
>
  @if (canRegister()) {
    <button appButton type="button" variant="add" (click)="openRegister()">Registrar</button>
  }
</app-page-header>

<app-movement-history [products]="products()" />

<app-modal [(open)]="formOpen" title="Registrar movimentação" size="lg">
  @if (formOpen()) {
    <app-movement-form
      [products]="products()"
      [canAdjust]="canAdjust()"
      (registered)="onRegistered($event)"
      (cancelled)="formOpen.set(false)"
    />
  }
</app-modal>
