<form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()" novalidate>
  @if (error(); as message) {
    <app-alert>{{ message }}</app-alert>
  }

  <div>
    <label for="cf-name" class="field-label">Nome</label>
    <input id="cf-name" class="field-input" formControlName="name" maxlength="120" />
    @if (isInvalid(form.controls.name)) {
      <p class="field-error">Informe o nome da categoria.</p>
    }
  </div>

  <div>
    <label for="cf-description" class="field-label">Descrição (opcional)</label>
    <textarea
      id="cf-description"
      rows="3"
      class="field-input"
      formControlName="description"
      maxlength="500"
    ></textarea>
  </div>

  <app-form-actions
    [submitLabel]="isEditing() ? 'Salvar alterações' : 'Criar categoria'"
    [saving]="saving()"
    (cancelled)="cancelled.emit()"
  />
</form>
