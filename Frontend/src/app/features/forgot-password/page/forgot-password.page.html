<app-auth-layout>
  <div class="mt-12">
    <h1 class="title-caps text-3xl text-text-strong">Esqueceu a senha?</h1>
    <p class="mt-1 text-base text-text-muted">
      A redefinição é feita por um administrador do sistema.
    </p>
  </div>

  <ol class="mt-8 space-y-5">
    @for (step of steps; track step.title; let index = $index) {
      <li class="flex gap-4">
        <span
          class="flex size-8 shrink-0 items-center justify-center rounded-full bg-brand-50 text-sm font-bold text-brand-800"
          aria-hidden="true"
        >
          {{ index + 1 }}
        </span>
        <div>
          <p class="text-sm font-semibold text-text-strong">{{ step.title }}</p>
          <p class="mt-0.5 text-sm text-text-muted">{{ step.description }}</p>
        </div>
      </li>
    }
  </ol>

  <a
    [href]="supportLink"
    class="mt-10 inline-flex h-12 w-full items-center justify-center rounded-lg bg-brand-primary px-6 text-base font-semibold text-white transition hover:bg-brand-primary-hover focus-visible:ring-2 focus-visible:ring-brand-primary focus-visible:ring-offset-2 focus-visible:outline-none"
  >
    Falar com o suporte
  </a>
  <p class="mt-2 text-center text-xs text-text-muted">{{ supportEmail }}</p>

  <a
    routerLink="/login"
    class="mt-6 inline-flex min-h-11 items-center rounded-sm text-sm font-medium text-brand-primary-hover underline-offset-2 hover:text-brand-900 hover:underline focus-visible:ring-2 focus-visible:ring-brand-primary focus-visible:ring-offset-2 focus-visible:outline-none"
  >
    ← Voltar para o login
  </a>
</app-auth-layout>
