<div class="flex h-dvh overflow-hidden">
  @if (menuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-black/50 lg:hidden"
      aria-label="Fechar menu"
      (click)="closeMenu()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col border-r border-line bg-white transition-[transform,visibility] lg:static lg:translate-x-0"
    [class]="menuOpen() ? 'translate-x-0' : '-translate-x-full max-lg:invisible'"
  >
    <div class="flex h-16 shrink-0 items-center border-b border-line px-6">
      <img src="/brand/logo.png" alt="Torrecid" width="2058" height="621" class="h-9 w-auto" />
    </div>

    <nav class="flex-1 space-y-1 overflow-y-auto px-3 py-4" aria-label="Principal">
      @for (item of items(); track item.path) {
        <a
          class="flex items-center gap-3 rounded-md border-l-4 px-3 py-2.5 text-sm transition focus-visible:ring-2 focus-visible:ring-brand-primary focus-visible:outline-none"
          [routerLink]="item.path"
          routerLinkActive
          ariaCurrentWhenActive="page"
          #link="routerLinkActive"
          [class]="link.isActive ? activeLinkClass : idleLinkClass"
          (click)="closeMenu()"
        >
          <svg
            viewBox="0 0 24 24"
            class="size-5 shrink-0"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            @for (d of item.icon; track $index) {
              <path [attr.d]="d" />
            }
          </svg>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col">
    <header
      class="sticky top-0 z-20 flex h-16 shrink-0 items-center gap-3 border-b border-line bg-white px-4 sm:px-6"
    >
      <button
        type="button"
        class="flex size-11 items-center justify-center rounded-md text-text-strong hover:bg-slate-100 focus-visible:ring-2 focus-visible:ring-brand-primary focus-visible:outline-none lg:hidden"
        aria-label="Abrir menu"
        (click)="menuOpen.set(true)"
      >
        <svg
          viewBox="0 0 24 24"
          class="size-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <path d="M4 6h16" />
          <path d="M4 12h16" />
          <path d="M4 18h16" />
        </svg>
      </button>

      <img
        src="/brand/logo.png"
        alt="Torrecid"
        width="2058"
        height="621"
        class="h-7 w-auto lg:hidden"
      />

      <div class="ml-auto">
        @if (user(); as u) {
          <app-user-menu [user]="u" (signOut)="logout()" />
        }
      </div>
    </header>

    <main class="flex min-h-0 flex-1 flex-col overflow-y-auto p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
