<div class="flex min-h-screen">
  @if (menuOpen()) {
    <button
      type="button"
      class="fixed inset-0 z-30 bg-black/50 lg:hidden"
      aria-label="Fechar menu"
      (click)="closeMenu()"
    ></button>
  }

  <aside
    class="fixed inset-y-0 left-0 z-40 flex w-64 flex-col bg-ink text-white transition-transform lg:sticky lg:top-0 lg:h-screen lg:translate-x-0"
    [class]="menuOpen() ? 'translate-x-0' : '-translate-x-full'"
  >
    <div class="flex items-center gap-3 px-6 py-6">
      <span class="h-8 w-2 rounded-full bg-brand-500"></span>
      <span class="text-lg font-semibold tracking-wide">Estoque</span>
    </div>

    <nav class="flex-1 space-y-1 px-3" aria-label="Principal">
      @for (item of items(); track item.path) {
        <a
          class="block rounded-md border-l-4 px-3 py-2.5 text-sm font-medium transition"
          [routerLink]="item.path"
          routerLinkActive
          #link="routerLinkActive"
          [class]="link.isActive ? activeLinkClass : idleLinkClass"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <p class="border-t border-white/10 px-6 py-4 text-xs text-white/40">
      Sistema de gerenciamento de estoque
    </p>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="flex items-center gap-3 border-b border-slate-200 bg-white px-4 py-3 sm:px-6">
      <button
        type="button"
        class="rounded-md p-2 text-slate-700 hover:bg-slate-100 lg:hidden"
        aria-label="Abrir menu"
        (click)="menuOpen.set(true)"
      >
        ☰
      </button>

      <div class="ml-auto flex items-center gap-4">
        @if (user(); as u) {
          <div class="hidden text-right leading-tight sm:block">
            <p class="text-sm font-semibold">{{ u.name }}</p>
            <p class="text-xs text-slate-500">{{ u.email }}</p>
          </div>
          <app-badge tone="success">{{ roleLabel(u.role) }}</app-badge>
        }
        <button appButton type="button" variant="secondary" size="sm" (click)="logout()">
          Sair
        </button>
      </div>
    </header>

    <main class="flex-1 p-4 sm:p-6 lg:p-8">
      <router-outlet />
    </main>
  </div>
</div>
