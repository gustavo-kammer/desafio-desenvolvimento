<dialog
  #dialog
  class="m-auto w-full rounded-lg border-0 p-0 text-slate-900 shadow-xl backdrop:bg-black/50"
  [class]="sizeClass()"
  [attr.aria-label]="title()"
  tabindex="-1"
  (close)="onNativeClose()"
  (keydown.escape)="close()"
  (click)="onBackdropClick($event)"
>
  <header class="flex items-center justify-between border-b border-line px-6 py-4">
    <h2 class="text-lg font-semibold">{{ title() }}</h2>
    <button
      type="button"
      class="rounded-md p-1 text-text-subtle hover:bg-slate-100 hover:text-slate-900"
      aria-label="Fechar"
      (click)="close()"
    >
      ✕
    </button>
  </header>
  <div class="px-6 py-5">
    <ng-content />
  </div>
</dialog>
