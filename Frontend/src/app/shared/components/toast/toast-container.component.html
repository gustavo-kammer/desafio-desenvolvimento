<div
  class="pointer-events-none fixed right-4 bottom-4 z-50 flex w-full max-w-sm flex-col gap-2"
  aria-live="polite"
>
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex items-start justify-between gap-3 rounded-md px-4 py-3 text-sm text-white shadow-lg"
      [class]="kindClass(toast.kind)"
      role="status"
    >
      <span>{{ toast.message }}</span>
      <button
        type="button"
        class="opacity-80 hover:opacity-100"
        aria-label="Fechar notificação"
        (click)="toastService.dismiss(toast.id)"
      >
        ✕
      </button>
    </div>
  }
</div>
