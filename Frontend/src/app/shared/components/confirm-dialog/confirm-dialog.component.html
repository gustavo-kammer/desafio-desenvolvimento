<app-modal [(open)]="open" [title]="title()">
  <p class="text-sm text-slate-700">{{ message() }}</p>
  <div class="mt-6 flex justify-end gap-2">
    <button appButton type="button" variant="secondary" (click)="open.set(false)">Cancelar</button>
    <button
      appButton
      type="button"
      [variant]="variant()"
      [loading]="loading()"
      (click)="confirmed.emit()"
    >
      {{ confirmLabel() }}
    </button>
  </div>
</app-modal>
